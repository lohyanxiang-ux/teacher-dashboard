<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LaTeX Math Scanner</title>
  <link rel="stylesheet" href="css/style.css">
  
  <!-- KaTeX Math Rendering Library -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
</head>
<body>
  <div class="app-container">
    <header class="top-nav">
      <div class="nav-left">
        <a href="index.html" class="nav-back">← Home</a>
        <button class="btn btn-secondary btn-small" id="toggle-panel-btn" onclick="toggleImagePanel()">◀ Hide Image</button>
      </div>
      <div class="title">📸 Handwriting & Screenshot Scanner</div>
      <div class="nav-actions">
        <!-- Button 1: Camera Trigger -->
        <label for="camera-input" class="btn btn-secondary" style="cursor: pointer;">📷 Camera</label>
        <!-- Button 2: Photo Library / Screenshot Picker -->
        <label for="file-input" class="btn btn-primary" style="cursor: pointer;">🖼️ Screenshot / File</label>
      </div>
    </header>

    <main class="scanner-layout">
      <!-- Image Source Panel -->
      <section class="panel camera-panel" id="camera-panel">
        <div class="panel-header">Raw Image Source</div>
        <div class="image-container" id="image-container">
          <img id="captured-image" class="hidden" alt="Student Work">
          <div id="camera-placeholder" class="placeholder-box">
            <span>No Image Loaded</span>
            <div class="placeholder-actions">
              <label for="file-input" class="btn btn-primary" style="cursor: pointer;">🖼️ Select Screenshot</label>
              <label for="camera-input" class="btn btn-secondary" style="cursor: pointer;">📷 Open Camera</label>
            </div>
            <small style="color: var(--text-muted);">Tip: You can also paste copied screenshots directly (⌘V)</small>
            <button class="btn btn-small" onclick="loadDemoImage()">Load Demo Equation</button>
          </div>
        </div>
        
        <!-- Camera-only capture input -->
        <input type="file" id="camera-input" accept="image/*" capture="environment" class="visually-hidden" onchange="handleImageCapture(event)">
        <!-- Photo Library & Screenshot file picker -->
        <input type="file" id="file-input" accept="image/*" class="visually-hidden" onchange="handleImageCapture(event)">
      </section>

      <!-- LaTeX Render & Canvas Markup Panel -->
      <section class="panel display-panel">
        <div class="panel-header">
          <div class="mode-toggle">
            <button class="btn btn-small btn-primary" id="btn-mode-draw" onclick="setInteractionMode('draw')">✏️ Draw</button>
            <button class="btn btn-small btn-secondary" id="btn-mode-scroll" onclick="setInteractionMode('scroll')">✋ Scroll</button>
          </div>
          <div class="canvas-tools">
            <button class="btn btn-small" onclick="setPenColor('#ef4444')">🔴 Red</button>
            <button class="btn btn-small" onclick="setPenColor('#3b82f6')">🔵 Blue</button>
            <button class="btn btn-small" onclick="setPenColor('#eab308')">🟡 Yellow</button>
            <button class="btn btn-small" onclick="clearCanvas()">🧹 Clear</button>
          </div>
        </div>

        <div class="latex-render-container" id="render-container">
          <div id="katex-output" class="katex-display"></div>
          <canvas id="markup-canvas"></canvas>
        </div>

        <div class="latex-code-bar">
          <label for="latex-input">Raw LaTeX:</label>
          <input type="text" id="latex-input" class="input-field" oninput="renderMath(this.value)">
        </div>
      </section>
    </main>
  </div>

  <script src="js/state.js"></script>
  <script src="js/scanner.js?v=7.0"></script>
</body>
</html>
