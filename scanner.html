<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LaTeX Math Scanner</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- KaTeX CSS & JS for Math Rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
</head>
<body>
  <div class="app-container">
    <header class="top-nav">
      <a href="index.html" class="nav-back">← Home</a>
      <div class="title">📸 Handwriting-to-LaTeX Scanner</div>
      <button class="btn btn-primary" onclick="triggerCamera()">📷 Take Photo</button>
    </header>

    <main class="scanner-layout">
      <!-- Input Source & Camera Panel -->
      <section class="panel camera-panel">
        <div class="panel-header">Raw Image Source</div>
        <div class="image-container" id="image-container">
          <img id="captured-image" class="hidden" alt="Student Work">
          <div id="camera-placeholder" class="placeholder-box">
            <span>No Image Captured</span>
            <button class="btn btn-secondary" onclick="triggerCamera()">Open iPad Camera</button>
            <button class="btn btn-small" onclick="loadDemoImage()">Load Demo Equation</button>
          </div>
        </div>
        <input type="file" id="camera-input" accept="image/*" capture="environment" class="hidden" onchange="handleImageCapture(event)">
      </section>

      <!-- LaTeX Render & Canvas Markup Panel -->
      <section class="panel display-panel">
        <div class="panel-header">
          <span>Rendered Mathematics</span>
          <div class="canvas-tools">
            <button class="btn btn-small" onclick="setPenColor('#ef4444')">🔴 Red</button>
            <button class="btn btn-small" onclick="setPenColor('#3b82f6')">🔵 Blue</button>
            <button class="btn btn-small" onclick="clearCanvas()">🧹 Clear</button>
          </div>
        </div>

        <div class="latex-render-container">
          <div id="katex-output" class="katex-display"></div>
          <!-- Canvas Overlay for Apple Pencil / Touch Drawing -->
          <canvas id="markup-canvas"></canvas>
        </div>

        <div class="latex-code-bar">
          <label for="latex-input">Raw LaTeX:</label>
          <input type="text" id="latex-input" class="input-field" oninput="renderMath(this.value)">
        </div>
      </section>
    </main>
  </div>

  <script src="js/state.js"></script>
  <script src="js/scanner.js"></script>
</body>
</html>
