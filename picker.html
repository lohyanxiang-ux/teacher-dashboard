<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smart Name Caller</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <header class="top-nav">
      <a href="index.html" class="nav-back">← Home</a>
      <div class="title">🎯 Smart Name Caller</div>
      <div class="pool-stats" id="pool-stats">Pool: 0 | Done: 0</div>
    </header>

    <main class="picker-layout">
      <!-- Main Draw Console -->
      <section class="picker-console">
        <button class="btn btn-huge" id="draw-btn" onclick="drawStudent()">🎲 DRAW STUDENT</button>
        
        <div class="student-card" id="student-display">
          <span class="placeholder">Tap Draw to Pick a Student</span>
        </div>

        <div class="timer-section">
          <div class="timer-display" id="timer-display">00:00</div>
          <div class="timer-buttons">
            <button class="btn btn-secondary" onclick="startTimer(15)">15s Think</button>
            <button class="btn btn-secondary" onclick="startTimer(30)">30s Pair</button>
            <button class="btn btn-secondary" onclick="startTimer(60)">60s Write</button>
          </div>
        </div>

        <!-- Marking Buttons -->
        <div class="response-actions">
          <button class="btn btn-green" onclick="markResponse('green')">🟢 Mastered (Done)</button>
          <button class="btn btn-yellow" onclick="markResponse('yellow')">🟡 Pass (Keep in Pool)</button>
          <button class="btn btn-red" onclick="markResponse('red')">🔴 Re-check Queue</button>
        </div>
      </section>

      <!-- Sidebar Queue -->
      <aside class="sidebar-queue">
        <h3>📌 Re-check Queue</h3>
        <ul id="recheck-list" class="queue-list"></ul>
        <button class="btn btn-small" onclick="resetClassPool()">🔄 Reset Active Pool</button>
      </aside>
    </main>
  </div>

  <script src="js/state.js"></script>
  <script src="js/picker.js"></script>
</body>
</html>
